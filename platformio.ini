; Smart Bio-Bathroom — PlatformIO project
;
; Two environments:
;   esp32dev - the real firmware, targets an ESP32 dev board (Arduino framework)
;   native   - host-machine unit tests for the pure gait-matching / lighting
;              logic in src/core, with no ESP32 toolchain or hardware required
;
; This device is fully offline: no WiFi/BLE/cloud code path. The adaptive
; "brain" is the Physarum polycephalum wetware (see docs/WETWARE.md); the
; ESP32 is only the interface to sensors, light, voice and the bio-electrodes.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<*>
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=8192
lib_deps =
    fastled/FastLED@^3.6.0
    adafruit/RTClib@^2.1.4
    kosme/arduinoFFT@^1.6.2
    dfrobot/DFRobotDFPlayerMini@^1.0.6

[env:native]
platform = native
build_src_filter = +<core/*>
test_build_src = true
build_flags =
    -std=gnu++17
    -Isrc/core
