services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bio_bathroom_dev
    volumes:
      - ..:/workspace
      - pio-cache:/root/.platformio
    stdin_open: true
    tty: true
    command: /bin/bash
    # No USB device bound here on purpose — building and testing (build.sh,
    # test.sh) don't need the board attached. upload.sh/monitor.sh pass
    # `--device=/dev/ttyUSB0` at run time instead, only when they need it.

volumes:
  pio-cache:
